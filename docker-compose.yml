services:
  db:
    image: mysql:8.0
    container_name: gastoclaro_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gastoclaro_development
      MYSQL_USER: gastoclaro
      MYSQL_PASSWORD: gastoclaro
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Crea la base de test y le da permisos a MYSQL_USER (solo corre con el volumen vacío).
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
