services:
  db:
    image: mysql:8.0
    container_name: gastoclaro_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gastoclaro_development
      MYSQL_USER: gastoclaro
      MYSQL_PASSWORD: gastoclaro
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
