default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 3306) %>
  username: <%= ENV.fetch("DB_USER", "gastoclaro") %>
  password: <%= ENV.fetch("DB_PASSWORD", "gastoclaro") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: gastoclaro_development

# La base de test se borra y se regenera: no la uses para nada más.
test:
  <<: *default
  database: gastoclaro_test

# En producción la contraseña no tiene valor por defecto: si falta DB_PASSWORD, MySQL rechaza la
# conexión en vez de entrar con la contraseña de desarrollo. (No se usa ENV.fetch sin default porque
# Rails evalúa este archivo en todos los entornos, también al compilar los assets de la imagen.)
production:
  primary: &primary_production
    <<: *default
    database: gastoclaro_production
    password: <%= ENV["DB_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: gastoclaro_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: gastoclaro_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: gastoclaro_production_cable
    migrations_paths: db/cable_migrate
